---
- name: Execute post-remediation OpenSCAP scan ({{ stig_os_key }})
  ansible.builtin.command: >
    oscap xccdf eval
    --profile {{ stig_profile }}
    --results {{ report_dir }}/post-scan-results.xml
    --report {{ report_dir }}/post-scan-report.html
    {{ scap_ds_path }}
  register: post_scan_result
  failed_when: false
  changed_when: true

- name: Display post-scan exit status
  ansible.builtin.debug:
    msg: >-
      Post-scan completed for {{ stig_os_key }}.
      Report saved at {{ report_dir }}/post-scan-report.html
