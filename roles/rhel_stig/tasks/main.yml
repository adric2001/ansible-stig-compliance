---
- name: Step 0 - Detect OS and select STIG config
  ansible.builtin.import_tasks: detect_os.yml

- name: Step 1 - Install prerequisites
  ansible.builtin.import_tasks: prerequisites.yml

- name: Step 2 - Run baseline scan
  ansible.builtin.import_tasks: scan_pre.yml

- name: Step 3 - Apply OS-specific STIG remediation
  ansible.builtin.import_tasks: remediate.yml

- name: Step 4 - Verify compliance status
  ansible.builtin.import_tasks: scan_post.yml

- name: Step 5 - Generate HTML reports and readable summary
  ansible.builtin.import_tasks: report_summary.yml
